[package]
name = "aw-watcher-vpn"
version = "0.2.6"
edition = "2021"
description = "Local Windows VPN network-context watcher for ActivityWatch"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ipnet = "2"
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["json"] }

